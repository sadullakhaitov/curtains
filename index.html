  <script>
    // Apply the saved (or system) theme before first paint so there is no flash.
    (function () {
      var t = null;
      try { t = localStorage.getItem('nm-theme'); } catch (e) {}
      if (t !== 'day' && t !== 'night') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>
